<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/brand_logo_luxury_1780395269921.png" />
    <title>Kết quả thanh toán VNPAY - Fióre</title>
  </head>
  <body class="bg-[#FCFAF7] text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">
    <div id="vnpay-return-root" class="w-full max-w-2xl bg-white rounded-3xl border border-rose-100/40 shadow-2xl p-6 md:p-10 text-center flex flex-col items-center">
      
      <!-- 1. LOADING PROCESSOR STATE -->
      <div id="loading-state" class="flex flex-col items-center py-12 space-y-4">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-rose-50 text-rose-500">
          <svg class="animate-spin h-8 w-8 text-rose-600" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
          </svg>
        </div>
        <div class="space-y-1">
          <p class="text-base font-serif font-semibold text-gray-900">Đang xác thực thông tin giao dịch</p>
          <p class="text-xs text-gray-400">Vui lòng không đóng trình duyệt hoặc tải lại trang này.</p>
        </div>
      </div>

      <!-- 2. RESULT DYNAMIC TARGET CONTENT -->
      <div id="result-content" class="hidden w-full transition-all duration-500 transform scale-95 opacity-0"></div>

    </div>

    <!-- Main Entry Script for compile and hydration -->
    <script type="module" src="/src/utils/vnpay-return.ts"></script>
  </body>
</html>
